server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: system-report-job
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${APP_DB_URL:jdbc:postgresql://postgres:5432/db_system_report_job}
    username: ${APP_DB_USERNAME:tigerpro}
    password: ${APP_DB_PASSWORD:secret}
    hikari:
      connection-timeout: 60000
      maximum-pool-size: 5
      minimum-idle: 3
      idle-timeout: 30000
      max-lifetime: 1800000
      pool-name: SystemReportJobHikariCP
      connection-test-query: SELECT 1
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        globally_quoted_identifiers: true
  flyway:
    enabled: true
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never
    properties:
      org:
        quartz:
          scheduler:
            instanceName: SystemReportJobScheduler
            instanceId: AUTO
          threadPool:
            # Số worker thread chạy job đồng thời (trước đây dùng ngầm định 10 của Quartz).
            threadCount: ${QUARTZ_THREAD_COUNT:10}
          jobStore:
            class: org.springframework.scheduling.quartz.LocalDataSourceJobStore
            driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
            tablePrefix: QRTZ_
            isClustered: ${QUARTZ_JOB_STORE_IS_CLUSTERED:false}
            clusterCheckinInterval: 20000
            useProperties: true

app:
  http-client:
    # Timeout cho RestClient dùng trong job action (tránh treo worker thread của Quartz).
    connect-timeout: 5s
    read-timeout: 25s
  job-action:
    # Thời gian tối đa chờ một job action hoàn tất trước khi huỷ và báo lỗi.
    execution-timeout: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when-authorized
