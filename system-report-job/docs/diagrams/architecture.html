<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>System Report Job · Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #eb6c36;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }

    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }

    .frame { max-width: 1200px; width: 100%; }

    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }

    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }

    svg { width: 100%; min-width: 900px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Architecture · system-report-job</p>
    <h1>Dynamic Quartz job/trigger management</h1>

    <svg viewBox="0 0 1120 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="srj-arch-title srj-arch-desc">
      <title id="srj-arch-title">System Report Job — service architecture</title>
      <desc id="srj-arch-desc">Architecture diagram showing a REST API creating tasks and job definitions that the application layer persists and schedules in Quartz; Quartz fires the trigger back into the application layer, which dispatches through a job action registry to an HTTP call action reaching a downstream service, with PostgreSQL as shared storage.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- ============ ARROWS (drawn before boxes) ============ -->

      <!-- A1: Client -> REST API -->
      <line x1="176" y1="96" x2="240" y2="96" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="190" y="76" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="208" y="85" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">HTTPS</text>

      <!-- A2: REST API -> Application -->
      <line x1="392" y1="96" x2="456" y2="96" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="406" y="76" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="424" y="85" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">CALL</text>

      <!-- A3: Application -> Quartz Scheduler (primary flow) -->
      <line x1="624" y1="80" x2="688" y2="80" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <rect x="638" y="60" width="36" height="12" rx="2" fill="#f5f5f5"/>
      <text x="656" y="69" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">SCHED</text>

      <!-- A4: Quartz Scheduler -> Application (fires back, async) -->
      <line x1="688" y1="112" x2="624" y2="112" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="634" y="120" width="44" height="12" rx="2" fill="#f5f5f5"/>
      <text x="656" y="129" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ON FIRE</text>

      <!-- A5: Application -> Job Action Registry (elbow) -->
      <path d="M 568,128 V 192 Q 568,200 576,200 H 764 Q 772,200 772,208 V 248"
            fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="616" y="180" width="56" height="12" rx="2" fill="#f5f5f5"/>
      <text x="644" y="189" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">DISPATCH</text>

      <!-- A6: Job Action Registry -> HTTP Call Action -->
      <line x1="856" y1="280" x2="920" y2="280" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="868" y="260" width="40" height="12" rx="2" fill="#f5f5f5"/>
      <text x="888" y="269" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.06em">ROUTE</text>

      <!-- A7: HTTP Call Action -> Downstream Service (vertical) -->
      <line x1="1004" y1="248" x2="1004" y2="128" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <rect x="1012" y="180" width="72" height="14" rx="2" fill="#f5f5f5"/>
      <text x="1016" y="191" fill="#2e5aa8" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">HTTP CALL</text>

      <!-- A8: Application -> PostgreSQL (vertical) -->
      <line x1="540" y1="128" x2="540" y2="248" stroke="#4f5d75" stroke-width="1" marker-end="url(#arrow)"/>
      <rect x="548" y="220" width="52" height="14" rx="2" fill="#f5f5f5"/>
      <text x="552" y="231" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.06em">PERSIST</text>

      <!-- ============ NODES ============ -->

      <!-- Client / API consumer (input) -->
      <rect x="40" y="64" width="136" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="64" width="136" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="48" y="72" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="62" y="81" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="108" y="100" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">API Consumer</text>
      <text x="108" y="116" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">internal caller</text>

      <!-- REST API -->
      <rect x="240" y="64" width="152" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="240" y="64" width="152" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="248" y="72" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="262" y="81" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">API</text>
      <text x="316" y="100" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">REST API</text>
      <text x="316" y="116" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">Task · JobDefinition</text>

      <!-- Application (use-case services) -->
      <rect x="456" y="64" width="168" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="456" y="64" width="168" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="464" y="72" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="480" y="81" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">APP</text>
      <text x="540" y="100" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Application</text>
      <text x="540" y="116" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">orchestrator services</text>

      <!-- Quartz Scheduler (focal) -->
      <rect x="688" y="64" width="168" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="688" y="64" width="168" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <rect x="696" y="72" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="712" y="81" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">JOB</text>
      <text x="772" y="100" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Quartz Scheduler</text>
      <text x="772" y="116" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">ScheduledJobExecutor</text>

      <!-- Downstream Service (external) -->
      <rect x="920" y="64" width="168" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="920" y="64" width="168" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="928" y="72" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <text x="944" y="81" fill="#7a8399" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="1004" y="100" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Downstream Service</text>
      <text x="1004" y="116" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">outbound HTTP endpoint</text>

      <!-- PostgreSQL (store) -->
      <rect x="456" y="248" width="168" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="456" y="248" width="168" height="64" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <rect x="464" y="256" width="24" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.50)" stroke-width="0.8"/>
      <text x="476" y="265" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DB</text>
      <text x="540" y="284" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">PostgreSQL</text>
      <text x="540" y="300" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">tasks · history · QRTZ_*</text>

      <!-- Job Action Registry -->
      <rect x="688" y="248" width="168" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="688" y="248" width="168" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="696" y="256" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="712" y="265" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">REG</text>
      <text x="772" y="284" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Job Action Registry</text>
      <text x="772" y="300" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">dispatch by jobType</text>

      <!-- HTTP Call Action -->
      <rect x="920" y="248" width="168" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="920" y="248" width="168" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="928" y="256" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="942" y="265" fill="#2d3142" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ACT</text>
      <text x="1004" y="284" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">HTTP Call Action</text>
      <text x="1004" y="300" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">RestClient · v-threads</text>

      <!-- ============ LEGEND ============ -->
      <line x1="40" y1="360" x2="1088" y2="360" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="40" y="376" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" letter-spacing="0.18em">LEGEND</text>

      <rect x="40" y="392" width="14" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="400" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Focal / scheduler</text>

      <rect x="200" y="392" width="14" height="10" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="220" y="400" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Backend service</text>

      <rect x="376" y="392" width="14" height="10" rx="2" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
      <text x="396" y="400" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Data store</text>

      <rect x="480" y="392" width="14" height="10" rx="2" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="500" y="400" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">External / downstream</text>

      <rect x="656" y="392" width="14" height="10" rx="2" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="676" y="400" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Caller / input</text>

      <line x1="800" y1="397" x2="828" y2="397" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
      <text x="836" y="400" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">HTTP / API</text>

      <line x1="928" y1="397" x2="956" y2="397" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
      <text x="964" y="400" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Primary flow</text>

      <line x1="40" y1="420" x2="68" y2="420" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <text x="76" y="423" fill="#4f5d75" font-size="8.5" font-family="'Geist', sans-serif">Async / internal</text>
    </svg>
  </div>
</body>
</html>
